name: Release URL health

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/platform.sh"
      - "lib/releases.sh"
      - "manifests/release-tools.tsv"
      - "manifests/versions.sh"
      - "tests/test-release-urls.sh"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify pinned downloads
        run: make verify-releases

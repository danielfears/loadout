<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Loadout</title>
  <desc id="desc">Workstation as code for DevOps engineers</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#1f1147"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8be9fd"/>
      <stop offset="1" stop-color="#bd93f9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#background)"/>
  <circle cx="1070" cy="55" r="150" fill="#8be9fd" opacity=".05"/>
  <circle cx="1120" cy="300" r="210" fill="#bd93f9" opacity=".07"/>

  <g transform="translate(70 54)">
    <rect width="214" height="214" rx="34" fill="#0b1020" stroke="url(#accent)" stroke-width="4"/>
    <path d="M47 67 91 107 47 147" fill="none" stroke="#8be9fd" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M105 151h61" stroke="#bd93f9" stroke-width="15" stroke-linecap="round" filter="url(#glow)"/>
    <g fill="#6272a4">
      <rect x="126" y="49" width="31" height="11" rx="5"/>
      <rect x="164" y="49" width="18" height="11" rx="5"/>
      <rect x="126" y="70" width="56" height="11" rx="5"/>
    </g>
  </g>

  <text x="340" y="155" fill="#f8f8f2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="112" font-weight="800" letter-spacing="-4">LOADOUT</text>
  <text x="346" y="210" fill="#8be9fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="600" letter-spacing="2">WORKSTATION AS CODE</text>
  <text x="346" y="254" fill="#b9c0d4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">One command. Same tools. Ready to ship.</text>
</svg>
